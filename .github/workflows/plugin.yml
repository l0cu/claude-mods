# Checks every pull request, and tags each new version once it reaches main.
#
# main is what the plugin directory and the claude-mods marketplace serve, so a
# pull request that changes a plugin must also raise its version and add it to
# CHANGELOG.md. After the merge, the directory picks the new commit up by itself.
#
# The plugins are the ones .claude-plugin/marketplace.json lists, each in the
# folder its `source` names. One `check` job goes through them all: it is the
# check main's protection requires, under that name.
name: plugin

on:
  pull_request:
  push:
    branches: [main]

env:
  # The Claude Code release the checks below were written against. Raise it on purpose.
  CLAUDE_CODE_VERSION: 2.1.329
  DISABLE_AUTOUPDATER: 1

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: The plugins the marketplace lists
        run: |
          plugins=$(jq -r '.plugins[].source | ltrimstr("./")' .claude-plugin/marketplace.json | tr '\n' ' ')
          echo "PLUGINS=${plugins}" >> "$GITHUB_ENV"
          echo "Plugins: ${plugins}"

      - name: Validate the marketplace and each plugin
        run: |
          claude plugin validate --strict .
          for plugin in $PLUGINS; do
            claude plugin validate --strict "./${plugin}"
          done

      # The plugin directory's own checks (a subset: the developer portal runs more).
      - name: Validate each plugin against the plugin directory's checks
        run: |
          for plugin in $PLUGINS; do
            claude plugin validate --strict --profile directory "./${plugin}"
          done

      - name: Run each plugin's tests
        run: |
          for plugin in $PLUGINS; do
            claude plugin test "${plugin}"
          done

      - name: A changed plugin raises its version and is in CHANGELOG.md
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          failed=0
          for plugin in $PLUGINS; do
            manifest="${plugin}/.claude-plugin/plugin.json"
            if git diff --quiet "$BASE" HEAD -- "${plugin}/"; then
              echo "${plugin} is unchanged: no new version needed."
              continue
            fi
            new=$(jq -r .version "$manifest")
            # A plugin the base does not have yet is new: any version, and its entry.
            if git cat-file -e "$BASE:$manifest" 2>/dev/null; then
              old=$(git show "$BASE:$manifest" | jq -r .version)
              highest=$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n1)
              if [ "$new" = "$old" ] || [ "$highest" != "$new" ]; then
                echo "::error file=$manifest::${plugin} changed, so raise its version above $old (it is $new)."
                failed=1
                continue
              fi
              echo "${plugin}: version $old -> $new."
            else
              echo "${plugin} is new, at version $new."
            fi
            if ! grep -Fxq "## ${plugin} ${new}" CHANGELOG.md; then
              echo "::error file=CHANGELOG.md::Add a '## ${plugin} ${new}' section for this version."
              failed=1
            fi
          done
          exit "$failed"

  tag:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The {name}--v{version} form that `claude plugin tag` uses, one per plugin.
      - name: Tag each plugin's version if it is new
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for plugin in $(jq -r '.plugins[].source | ltrimstr("./")' .claude-plugin/marketplace.json); do
            version=$(jq -r .version "${plugin}/.claude-plugin/plugin.json")
            tag="${plugin}--v${version}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "${tag} already exists."
              continue
            fi
            git tag -a "${tag}" -m "${plugin} ${version}"
            git push origin "${tag}"
            echo "Tagged ${tag}."
          done
