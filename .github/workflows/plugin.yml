# Checks every pull request, and tags each new version once it reaches main.
#
# main is what the plugin directory and the claude-mods marketplace serve, so a
# pull request that changes the plugin must also raise its version and add it to
# CHANGELOG.md. After the merge, the directory picks the new commit up by itself.
name: plugin

on:
  pull_request:
  push:
    branches: [main]

env:
  # The Claude Code release the checks below were written against. Raise it on purpose.
  CLAUDE_CODE_VERSION: 2.1.329
  DISABLE_AUTOUPDATER: 1
  PLUGIN: usage

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Validate the marketplace and the plugin
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict "./${PLUGIN}"

      # The plugin directory's own checks (a subset: the developer portal runs more).
      - name: Validate against the plugin directory's checks
        run: claude plugin validate --strict --profile directory "./${PLUGIN}"

      - name: Run the plugin's tests
        run: claude plugin test "${PLUGIN}"

      - name: A change to the plugin raises its version and is in CHANGELOG.md
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          manifest="${PLUGIN}/.claude-plugin/plugin.json"
          if git diff --quiet "$BASE" HEAD -- "${PLUGIN}/"; then
            echo "The plugin is unchanged: no new version needed."
            exit 0
          fi
          old=$(git show "$BASE:$manifest" | jq -r .version)
          new=$(jq -r .version "$manifest")
          highest=$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n1)
          if [ "$new" = "$old" ] || [ "$highest" != "$new" ]; then
            echo "::error file=$manifest::The plugin changed, so raise its version above $old (it is $new)."
            exit 1
          fi
          if ! grep -Fxq "## ${PLUGIN} ${new}" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::Add a '## ${PLUGIN} ${new}' section for this version."
            exit 1
          fi
          echo "Version $old -> $new, in CHANGELOG.md."

  tag:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The {name}--v{version} form that `claude plugin tag` uses.
      - name: Tag the version if it is new
        run: |
          version=$(jq -r .version "${PLUGIN}/.claude-plugin/plugin.json")
          tag="${PLUGIN}--v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "${PLUGIN} ${version}"
          git push origin "${tag}"
          echo "Tagged ${tag}."
